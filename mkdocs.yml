site_name: AI 模型知识树
site_description: 从 0 到 1 的 AI 模型知识体系 · 通俗类比 + 图解 + 能跑的代码
site_url: https://lizhengzhong20-sketch.github.io/model_learning/
repo_url: https://github.com/lizhengzhong20-sketch/model_learning
repo_name: lizhengzhong20-sketch/model_learning

theme:
  name: material
  language: zh
  features:
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - search.highlight
    - search.share
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/weather-night, name: 切换到深色 }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/weather-sunny, name: 切换到浅色 }

markdown_extensions:
  - attr_list
  - md_in_html
  - def_list
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
  - https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js
  - js/extra.js

extra_css:
  - css/extra.css

# nav 由 tools/build_site.py 生成注入（保持与目录同步），此处留空
nav: []
